# Include inside the HTTPS server serving mythstribe.com. This forwards the
# default client endpoint https://mythstribe.com/d2r-cloud/v1 to the loopback
# service and strips that public prefix.
location = /d2r-cloud/healthz {
    proxy_pass http://127.0.0.1:8765/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

location /d2r-cloud/v1/ {
    client_max_body_size 48m;
    proxy_pass http://127.0.0.1:8765/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering on;
    proxy_buffering off;
}
